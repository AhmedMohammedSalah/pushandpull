<!DOCTYPE html>
<html>
<head>
    <title>Live Stock Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .dashboard {
            max-width: 1000px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .positive {
            color: #4CAF50;
        }
        .negative {
            color: #F44336;
        }
        .last-update {
            text-align: right;
            font-style: italic;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Live Stock Dashboard</h1>
        <table id="stock-table">
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Company</th>
                    <th>Price</th>
                    <th>Change</th>
                    <th>% Change</th>
                    <th>Last Update</th>
                </tr>
            </thead>
            <tbody id="stock-data">
                <!-- Stock data will be inserted here -->
            </tbody>
        </table>
        <div class="last-update" id="last-update"></div>
    </div>

    <script>
        const eventSource = new EventSource("stock_server.php");
        const stockTable = document.getElementById('stock-data');
        const lastUpdate = document.getElementById('last-update');
        
        eventSource.onmessage = function(event) {
            const stocks = JSON.parse(event.data);
            stockTable.innerHTML = '';
            
            stocks.forEach(stock => {
                const row = document.createElement('tr');
                
                const changeClass = stock.change.startsWith('+') ? 'positive' : 'negative';
                const percentClass = stock.percentChange.startsWith('+') ? 'positive' : 'negative';
                
                row.innerHTML = `
                    <td>${stock.symbol}</td>
                    <td>${stock.name}</td>
                    <td>$${stock.price}</td>
                    <td class="${changeClass}">${stock.change}</td>
                    <td class="${percentClass}">${stock.percentChange}</td>
                    <td>${stock.timestamp}</td>
                `;
                
                stockTable.appendChild(row);
            });
            
            lastUpdate.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
        };
        
        eventSource.onerror = function() {
            console.error("EventSource failed.");
        };
    </script>
</body>
</html>
