<!DOCTYPE html>
<html>
<head>
    <title>Item Grid with Delete</title>
    <style>
        table { 
            border-collapse: collapse;
             width: 100%; 
            margin: 20px 0;
            font-size: 18px;
            text-align: left;

        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: left; 

        }
        th { background-color: #f2f2f2; }
        .delete-btn { color: red; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Product List</h2>
    <table id="productTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr id="product-1">
                <td>1</td>
                <td>Laptop</td>
                <td>999LE</td>
                <td><span class="delete-btn" onclick="deleteProduct(1)">Delete</span></td>
            </tr>
            <tr id="product-2">
                <td>2</td>
                <td>Phone</td>
                <td>6099LE</td>
                <td><span class="delete-btn" onclick="deleteProduct(2)">Delete</span></td>
            </tr>
            <tr id="product-3">
                <td>3</td>
                <td>Tablet</td>
                <td>3949LE</td>
                <td><span class="delete-btn" onclick="deleteProduct(3)">Delete</span></td>
            </tr>
        </tbody>
    </table>

    <script>
        function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) {
                return;
            }
            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'deleteProduct.php', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            
            xhr.onload = function() {
                if (this.status === 200) {
                    const response = JSON.parse(this.responseText);
                    if (response.success) {
                        const row = document.getElementById(`product-${productId}`);
                        if (row) {
                            row.remove();
                        }
                    } else {
                        alert('Failed to delete product: ' + response.message);
                    }
                } else {
                    alert('Request failed');
                }
            };
            
            xhr.onerror = function() {
                alert('Request error');
            };
            
            xhr.send(`id=${productId}`);
        }
    </script>
</body>
</html>
