<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h2>User Registration</h2>
    <form id="registrationForm">
        <div>
            <label>Name:</label>
            <input type="text" id="name" >
        </div>
        <div>
            <label>Email:</label>
            <input type="email" id="email" >
        </div>
        <div>
            <label>Password:</label>
            <input type="password" id="password" >
        </div>
        <button type="submit">Register</button>
    </form>
    <div id="message"></div>

    <script>
        const form = document.getElementById('registrationForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (!name || !email || !password) {
                messageDiv.innerHTML = '<span class="error">All fields are required</span>';
                return;
            }
    
            const formData = new FormData();
            formData.append('name', name);
            formData.append('email', email);
            formData.append('password', password);
            
            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'register.php', true);
            
            xhr.onload = function() {
                if (this.status === 200) {
                    const response = JSON.parse(this.responseText);
                    if (response.success) {
                        messageDiv.innerHTML = `<span class="success">${response.message}</span>`;
                        form.reset();
                    } else {
                        messageDiv.innerHTML = `<span class="error">${response.message}</span>`;
                    }
                } else {
                    messageDiv.innerHTML = '<span class="error">Registration failed</span>';
                }
            };
            
            xhr.onerror = function() {
                messageDiv.innerHTML = '<span class="error">Request failed</span>';
            };
            
            xhr.send(formData);
        });
    </script>
</body>
</html>
